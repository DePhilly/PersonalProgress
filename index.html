<title>Voortgang</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voortgang">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%235B21F5'/%3E%3Ccircle cx='130' cy='50' r='19' fill='%23FF2E88'/%3E%3Cpath d='M28 130 L68 90 L96 112 L152 56' stroke='%23FFC53D' stroke-width='19' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  :root{
    color-scheme:dark;
    --canvas:#08070E;
    --raise:#151322;
    --raise2:#1E1B2E;
    --ink:#F5F3FC;
    --soft:#918DB4;
    --line:#272338;
    --violet:#8B5CFF;
    --magenta:#FF3D8B;
    --citrus:#FFC53D;
    --aqua:#00E0B0;
    --radius:20px;
    --top:env(safe-area-inset-top,0px);
    --bot:env(safe-area-inset-bottom,0px);
    --display:"Bricolage Grotesque","Archivo",system-ui,-apple-system,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--canvas)}
  html{min-height:100%}
  body{
    background:
      radial-gradient(120% 62% at 78% -12%, rgba(139,92,255,.22), transparent 62%),
      radial-gradient(88% 44% at 6% -6%, rgba(255,61,139,.14), transparent 60%),
      var(--canvas);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    padding:0 0 calc(40px + var(--bot));
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  /* ---------- header ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:calc(var(--top) + 14px);padding-bottom:14px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--canvas) 62%, rgba(8,7,14,.72) 88%, transparent);
    backdrop-filter:blur(10px);
    margin:0 -16px;padding-left:16px;padding-right:16px;
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand h1{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:88%;margin:0;letter-spacing:-.03em}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--magenta);box-shadow:0 0 12px var(--magenta)}
  .tools{display:flex;gap:6px}
  .ghost{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--soft)}
  .ghost:active{background:var(--raise2);color:var(--ink)}

  /* ---------- hero ---------- */
  .hero{
    position:relative;border-radius:26px;overflow:hidden;color:#fff;
    background:linear-gradient(146deg,#5B21F5 0%,#9B12C8 48%,#FF3D8B 100%);
    min-height:min(58vh,380px);display:flex;flex-direction:column;justify-content:flex-end;
    border:1px solid rgba(255,255,255,.07);
  }
  .hero .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,10,.10) 0%,rgba(5,4,10,.40) 44%,rgba(5,4,10,.92) 100%)}
  .hero .inner{position:relative;padding:24px 22px 22px}
  .hero .when{font-size:13px;opacity:.82;margin:0 0 3px}
  .bignum{display:flex;align-items:baseline;gap:8px;margin:0}
  .bignum b{font-family:var(--display);font-weight:800;font-stretch:78%;font-size:clamp(64px,20vw,96px);line-height:.85;letter-spacing:-.045em}
  .bignum span{font-size:17px;font-weight:600;opacity:.78}
  .delta{display:inline-flex;align-items:center;gap:6px;margin-top:13px;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.15);backdrop-filter:blur(8px)}
  .delta.good{background:var(--aqua);color:#032621}
  .delta.up{background:var(--citrus);color:#3B2A00}
  .goalbar{margin-top:16px}
  .goalbar .track{height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .goalbar .fill{height:100%;border-radius:99px;background:var(--citrus);transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .goalbar p{margin:9px 0 0;font-size:12.5px;opacity:.86}
  .hero.empty{align-items:center;justify-content:center;text-align:center;min-height:290px}
  .hero.empty .inner{padding:36px 26px}
  .hero.empty h2{font-family:var(--display);font-size:27px;font-weight:800;font-stretch:85%;margin:0 0 9px;letter-spacing:-.03em}
  .hero.empty p{margin:0;opacity:.88;font-size:14.5px;max-width:32ch;margin-inline:auto}

  /* ---------- primary action ---------- */
  .cta{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    margin-top:14px;padding:17px;border-radius:17px;
    background:linear-gradient(135deg,var(--violet),#B84DFF);color:#fff;
    font-size:16px;font-weight:600;box-shadow:0 8px 26px -8px rgba(139,92,255,.85);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(2px);box-shadow:0 4px 14px -8px rgba(139,92,255,.85)}
  .cta .plus{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}

  /* ---------- stat strip ---------- */
  .strip{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
  .stat{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:13px 13px}
  .stat h4{margin:0 0 5px;font-size:11.5px;font-weight:600;color:var(--soft)}
  .stat .v{font-family:var(--display);font-size:24px;font-weight:700;font-stretch:85%;letter-spacing:-.03em;line-height:1.1}
  .stat .v small{font-size:12px;font-weight:600;color:var(--soft);margin-left:2px}
  .stat .c{font-size:11.5px;font-weight:600;margin-top:4px;color:var(--soft)}
  .stat .c.dn{color:var(--aqua)}.stat .c.upx{color:var(--magenta)}

  /* ---------- cards ---------- */
  section.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
  .card h3{font-family:var(--display);font-size:17px;font-weight:700;font-stretch:88%;margin:0;letter-spacing:-.02em}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .hint{color:var(--soft);font-size:13px;margin:0}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--soft);background:var(--raise2)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0B0912}

  /* ---------- chart ---------- */
  .chartbox{position:relative;width:100%;height:215px;touch-action:pan-y}
  .chartbox svg{display:block;width:100%;height:100%;overflow:visible}
  .tip{position:absolute;transform:translate(-50%,-118%);background:var(--ink);color:#0B0912;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
  .tip b{font-family:var(--display);font-weight:800}
  .tip.on{opacity:1}

  /* ---------- timeline ---------- */
  .entry{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;background:var(--raise2)}
  .entry.recent{border-color:rgba(139,92,255,.55);box-shadow:0 0 0 1px rgba(139,92,255,.22)}
  .entry .row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .week{background:rgba(139,92,255,.18);color:#C4A8FF;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
  .date{font-size:13px;color:var(--soft)}
  .entry .w{font-family:var(--display);font-size:29px;font-weight:800;font-stretch:82%;letter-spacing:-.035em;margin:8px 0 0;line-height:1.1}
  .entry .w small{font-size:13px;font-weight:600;color:var(--soft);margin-left:3px}
  .tag{margin-left:auto;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--soft)}
  .tag.dn{background:rgba(0,224,176,.16);color:var(--aqua)}
  .tag.upx{background:rgba(255,61,139,.16);color:#FF7AB0}
  .thumbs{display:flex;gap:8px;margin-top:12px}
  .thumbs button{width:calc((100% - 16px)/3);aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:var(--line);padding:0;border:1px solid var(--line)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .mgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .m{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--soft)}
  .m b{font-family:var(--display);font-weight:700;color:var(--ink);font-size:13.5px}
  .note{margin:11px 0 0;font-size:13.5px;color:var(--soft);border-left:3px solid var(--citrus);padding-left:11px}
  .acts{display:flex;gap:16px;margin-top:13px}
  .acts button{font-size:13px;font-weight:600;color:var(--soft);padding:3px 0}
  .acts button.armed{color:var(--magenta)}

  /* ---------- compare ---------- */
  .cmpsel{display:flex;gap:8px;margin-bottom:10px}
  select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--raise2);color:var(--ink);font-size:13px;appearance:none}
  .cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--raise2);touch-action:none;user-select:none}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cmp .after{clip-path:inset(0 0 0 50%)}
  .cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 16px rgba(0,0,0,.7)}
  .cmp .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#5B21F5;box-shadow:0 4px 18px rgba(0,0,0,.55)}
  .cmp .lab{position:absolute;bottom:12px;padding:6px 11px;border-radius:999px;background:rgba(8,7,14,.78);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
  .cmp .lab.l{left:12px}.cmp .lab.r{right:12px}

  /* ---------- sheet ---------- */
  .veil{position:fixed;inset:0;background:rgba(4,3,9,.7);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:#100E1B;
    border-radius:26px 26px 0 0;border-top:1px solid var(--line);
    max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.25,1);
    padding:0 16px calc(28px + var(--bot));
    max-width:640px;margin:0 auto;
  }
  .sheet.on{transform:none}
  .grab{width:42px;height:4px;border-radius:99px;background:#3A3550;margin:11px auto 4px}
  .sheet h2{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:88%;margin:10px 0 16px;letter-spacing:-.03em}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:6px}
  .inp{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--raise2);color:var(--ink);font-size:16px}
  .inp::placeholder{color:#5D5878}
  .inp:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(139,92,255,.22)}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
  .unit{position:relative}
  .unit .inp{padding-right:46px}
  .unit i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--soft);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  textarea.inp{min-height:76px;resize:vertical;font-size:15px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .ptile{position:relative;aspect-ratio:3/4;border-radius:15px;border:1.5px dashed #3A3550;background:var(--raise2);display:grid;place-items:center;text-align:center;overflow:hidden}
  .ptile input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .ptile .ph{font-size:12px;font-weight:600;color:var(--soft);padding:0 6px}
  .ptile .ph em{display:block;font-style:normal;font-size:20px;margin-bottom:5px;color:var(--violet)}
  .ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ptile .kill{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(8,7,14,.8);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;z-index:2}
  .ptile .cap{position:absolute;left:0;right:0;bottom:0;padding:5px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(8,7,14,.85))}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--raise2);border:1px solid var(--line);border-radius:15px;padding:14px;margin:18px 0 0}
  .toggle p{margin:0;font-size:14px;font-weight:600}
  .toggle small{display:block;font-weight:400;color:var(--soft);font-size:12.5px;margin-top:3px}
  .sw{width:52px;height:30px;border-radius:99px;background:#332E4A;position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
  .sw[aria-pressed="true"]{background:var(--aqua)}
  .sw[aria-pressed="true"]::after{transform:translateX(22px)}
  .fold{display:none;margin-top:16px}
  .fold.on{display:block;animation:slip .28s ease}
  @keyframes slip{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fold h4{font-size:12.5px;font-weight:600;color:var(--soft);margin:0 0 9px}
  .save{width:100%;padding:17px;border-radius:16px;background:linear-gradient(135deg,var(--violet),#B84DFF);color:#fff;font-size:16px;font-weight:600;margin-top:20px;box-shadow:0 8px 26px -10px rgba(139,92,255,.9)}
  .save:disabled{opacity:.6}
  .cancel{width:100%;padding:13px;font-size:14px;font-weight:600;color:var(--soft);margin-top:6px}
  .err{color:var(--magenta);font-size:13px;font-weight:600;margin:12px 0 0}

  /* ---------- lightbox ---------- */
  .box{position:fixed;inset:0;z-index:60;background:rgba(4,3,9,.97);display:none;place-items:center;padding:calc(var(--top) + 60px) 16px calc(var(--bot) + 60px)}
  .box.on{display:grid}
  .box img{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain}
  .box .cap2{position:absolute;bottom:calc(var(--bot) + 22px);left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600}
  .box .x{position:absolute;top:calc(var(--top) + 12px);right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:19px}

  .toast{position:fixed;left:50%;bottom:calc(var(--bot) + 26px);transform:translate(-50%,20px);background:var(--ink);color:#0B0912;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .warn{background:rgba(255,197,61,.1);border:1px solid rgba(255,197,61,.35);border-radius:16px;padding:13px 15px;font-size:13.5px;color:#F0D79A;margin-bottom:12px;line-height:1.45}
  .warn b{color:var(--citrus)}
  .skel{height:min(58vh,380px);border-radius:26px;background:linear-gradient(100deg,#151322,#211E33,#151322);background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  footer{color:#5D5878;font-size:12.5px;text-align:center;margin-top:24px;padding:0 20px}

  @media (min-width:560px){
    .strip{grid-template-columns:repeat(4,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span><h1>Voortgang</h1></div>
    <div class="tools">
      <button class="ghost" id="goalBtn">Doel</button>
      <button class="ghost" id="expBtn">Back-up</button>
      <button class="ghost" id="impBtn">Terugzetten</button>
      <input type="file" accept="application/json,.json" id="impInput" hidden>
    </div>
  </header>

  <div id="heroSlot"><div class="skel"></div></div>

  <button class="cta" id="addBtn"><span class="plus">+</span> Meting toevoegen</button>

  <div class="strip" id="strip"></div>

  <section class="card" id="chartCard" hidden>
    <div class="head"><h3>Verloop</h3><span class="hint" id="rangeLbl"></span></div>
    <div class="chips" id="metricChips"></div>
    <div class="chartbox" id="chartBox"><svg id="chart"></svg><div class="tip" id="tip"></div></div>
  </section>

  <section class="card" id="cmpCard" hidden>
    <div class="head"><h3>Toen en nu</h3></div>
    <div class="cmpsel">
      <select id="cmpA" aria-label="Eerste meting"></select>
      <select id="cmpB" aria-label="Tweede meting"></select>
    </div>
    <div class="chips" id="poseChips"></div>
    <div class="cmp" id="cmp">
      <img id="imgA" alt="Eerdere foto">
      <img id="imgB" class="after" alt="Latere foto">
      <div class="handle" id="handle"><div class="knob">↔</div></div>
      <span class="lab l" id="labA"></span><span class="lab r" id="labB"></span>
    </div>
    <p class="hint" id="cmpHint" style="margin-top:10px"></p>
  </section>

  <section class="card">
    <div class="head"><h3>Alle metingen</h3><span class="hint" id="countLbl"></span></div>
    <div id="list"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="veil" id="veil"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h2 id="sheetTitle">Nieuwe meting</h2>

  <div class="two">
    <div class="field">
      <label for="fDate">Datum</label>
      <input class="inp" type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fWeight">Gewicht</label>
      <div class="unit"><input class="inp" type="text" inputmode="decimal" id="fWeight" placeholder="82,4"><i>kg</i></div>
    </div>
  </div>

  <div class="field">
    <label>Foto's</label>
    <div class="photos" id="photoTiles"></div>
  </div>

  <div class="field">
    <label for="fNote">Notitie</label>
    <textarea class="inp" id="fNote" placeholder="Hoe voelde deze week?"></textarea>
  </div>

  <div class="toggle">
    <p>Bodyscan gedaan<small>Vul de cijfers van je meting in</small></p>
    <button class="sw" id="scanSw" aria-pressed="false" aria-label="Bodyscan-velden tonen"></button>
  </div>

  <div class="fold" id="scanFold">
    <div class="two">
      <div class="field"><label for="fFat">Vetpercentage</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fFat" placeholder="18,2"><i>%</i></div></div>
      <div class="field"><label for="fMuscle">Spiermassa</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fMuscle" placeholder="63,1"><i>kg</i></div></div>
      <div class="field"><label for="fVisc">Visceraal vet</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fVisc" placeholder="6"><i>niv</i></div></div>
      <div class="field"><label for="fWater">Lichaamsvocht</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fWater" placeholder="58"><i>%</i></div></div>
      <div class="field"><label for="fBone">Botmassa</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fBone" placeholder="3,2"><i>kg</i></div></div>
      <div class="field"><label for="fBmr">Ruststofwisseling</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="fBmr" placeholder="1780"><i>kcal</i></div></div>
    </div>
    <h4 style="margin-top:4px">Omtrekken in centimeters</h4>
    <div class="two">
      <div class="field"><label for="mWaist">Taille</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="mWaist"><i>cm</i></div></div>
      <div class="field"><label for="mChest">Borst</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="mChest"><i>cm</i></div></div>
      <div class="field"><label for="mHip">Heup</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="mHip"><i>cm</i></div></div>
      <div class="field"><label for="mArm">Bovenarm</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="mArm"><i>cm</i></div></div>
      <div class="field"><label for="mThigh">Bovenbeen</label><div class="unit"><input class="inp" type="text" inputmode="decimal" id="mThigh"><i>cm</i></div></div>
    </div>
  </div>

  <p class="err" id="formErr" hidden></p>
  <button class="save" id="saveBtn">Meting opslaan</button>
  <button class="cancel" id="closeBtn">Annuleren</button>
</div>

<div class="box" id="box"><button class="x" id="boxX" aria-label="Sluiten">✕</button><img id="boxImg" alt=""><div class="cap2" id="boxCap"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ opslag ============
   Vier lagen, in deze volgorde: de opslag van de chatweergave, IndexedDB,
   localStorage, en als laatste het geheugen (verdwijnt bij sluiten). */
var mem = new Map();
var backend = 'mem';
var DB = null;

function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error('no idb'));
    var rq = indexedDB.open('voortgang', 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('kv'); };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror = function(){ rej(rq.error||new Error('idb')); };
    rq.onblocked = function(){ rej(new Error('blocked')); };
  });
}
function idbDo(mode, fn){
  return new Promise(function(res,rej){
    if(!DB) return rej(new Error('no db'));
    var tx = DB.transaction('kv', mode), st = tx.objectStore('kv'), rq = fn(st);
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error||new Error('abort')); };
    if(rq) rq.onsuccess = function(){ res(rq.result); };
    else tx.oncomplete = function(){ res(true); };
  });
}

async function initStore(){
  if(window.storage && window.storage.get){
    try{
      await window.storage.set('__probe','1');
      var p = await window.storage.get('__probe');
      if(p && p.value==='1'){ backend='app'; return; }
    }catch(e){}
  }
  try{
    DB = await idbOpen();
    await idbDo('readwrite', function(st){ return st.put('1','__probe'); });
    var v = await idbDo('readonly', function(st){ return st.get('__probe'); });
    if(v==='1'){ backend='idb'; }
  }catch(e){ DB=null; }
  if(backend==='mem'){
    try{
      localStorage.setItem('__probe','1');
      if(localStorage.getItem('__probe')==='1'){ localStorage.removeItem('__probe'); backend='ls'; }
    }catch(e){}
  }
  if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
}

async function sget(k){
  try{
    if(backend==='app'){ return await window.storage.get(k); }
    if(backend==='idb'){ var v = await idbDo('readonly', function(st){ return st.get(k); }); return v===undefined?null:{value:v}; }
    if(backend==='ls'){ var s = localStorage.getItem(k); return s===null?null:{value:s}; }
  }catch(e){ return null; }
  return mem.has(k) ? {value:mem.get(k)} : null;
}
async function sset(k,v){
  try{
    if(backend==='app'){ await window.storage.set(k,v); return true; }
    if(backend==='idb'){ await idbDo('readwrite', function(st){ return st.put(v,k); }); return true; }
    if(backend==='ls'){ localStorage.setItem(k,v); return true; }
  }catch(e){
    if(e && (e.name==='QuotaExceededError'||e.code===22)) toast('Opslag is vol, verwijder oude metingen');
    return false;
  }
  mem.set(k,v); return true;
}
async function sdel(k){
  try{
    if(backend==='app'){ await window.storage.delete(k); return true; }
    if(backend==='idb'){ await idbDo('readwrite', function(st){ return st.delete(k); }); return true; }
    if(backend==='ls'){ localStorage.removeItem(k); return true; }
  }catch(e){ return false; }
  mem.delete(k); return true;
}

/* ============ state ============ */
var S = { entries:[], goal:null, metric:'weight', pose:'front', editId:null, draft:{}, cache:{} };
var POSES = [['front','Voorkant'],['side','Zijkant'],['back','Achterkant']];
var METRICS = {
  weight:{label:'Gewicht',unit:'kg',get:function(e){return e.weight;},color:'#8B5CFF'},
  fat:{label:'Vetpercentage',unit:'%',get:function(e){return e.scan&&e.scan.fat;},color:'#FF3D8B'},
  muscle:{label:'Spiermassa',unit:'kg',get:function(e){return e.scan&&e.scan.muscle;},color:'#00E0B0'},
  waist:{label:'Taille',unit:'cm',get:function(e){return e.meas&&e.meas.waist;},color:'#FFA23D'},
  visc:{label:'Visceraal vet',unit:'',get:function(e){return e.scan&&e.scan.visc;},color:'#C46BFF'},
  water:{label:'Lichaamsvocht',unit:'%',get:function(e){return e.scan&&e.scan.water;},color:'#4D9BFF'}
};

/* ============ helpers ============ */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function num(v){ if(v===null||v===undefined||v==='') return null; var n=parseFloat(String(v).replace(',','.').trim()); return isFinite(n)?n:null; }
function fmt(n,d){ if(n===null||n===undefined) return '–'; return n.toLocaleString('nl-NL',{minimumFractionDigits:d===undefined?1:d,maximumFractionDigits:d===undefined?1:d}); }
function signed(n,d){ if(n===null) return '–'; var s=n>0?'+':(n<0?'−':''); return s+fmt(Math.abs(n),d===undefined?1:d); }
function dNL(iso,long){ var d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('nl-NL',long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'}); }
function isoWeek(iso){
  var d=new Date(iso+'T12:00:00'); var t=new Date(d.getTime());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},2200); }

/* ============ foto's verkleinen ============ */
function readDataURL(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(r.result); };
    r.onerror=function(){ rej(new Error('read')); };
    r.onabort=function(){ rej(new Error('abort')); };
    try{ r.readAsDataURL(file); }catch(e){ rej(e); }
  });
}
function loadImg(src){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){ res(im); };
    im.onerror=function(){ rej(new Error('decode')); };
    im.src=src;
  });
}
function canvasOut(src,w,h,max,q){
  if(!w||!h) return null;
  try{
    var sc=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
    var x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.drawImage(src,0,0,c.width,c.height);
    var out=c.toDataURL('image/jpeg',q);
    return (out && out.length>200) ? out : null;
  }catch(e){ return null; }
}
/* Drie routes: bestand inlezen en verkleinen via <img>, anders via createImageBitmap,
   anders het bestand ongewijzigd bewaren. Zo strandt een upload nooit op één techniek. */
async function shrink(file,max,q){
  var dataUrl=null, out=null;
  try{ dataUrl=await readDataURL(file); }catch(e){}

  if(dataUrl){
    try{
      var im=await loadImg(dataUrl);
      out=canvasOut(im, im.naturalWidth||im.width, im.naturalHeight||im.height, max, q);
      if(out) return out;
    }catch(e){}
  }
  if(typeof createImageBitmap==='function'){
    try{
      var bm=await createImageBitmap(file);
      out=canvasOut(bm, bm.width, bm.height, max, q);
      if(bm.close) bm.close();
      if(out) return out;
    }catch(e){}
  }
  if(dataUrl) return dataUrl;
  throw new Error('unsupported');
}

/* ============ laden ============ */
async function load(){
  var a = await sget('log:entries');
  if(a && a.value){ try{ S.entries = JSON.parse(a.value)||[]; }catch(e){ S.entries=[]; } }
  var b = await sget('log:settings');
  if(b && b.value){ try{ S.goal = (JSON.parse(b.value)||{}).goal || null; }catch(e){} }
  sort(); renderAll();
}
function sort(){ S.entries.sort(function(x,y){ return x.date<y.date?-1:(x.date>y.date?1:0); }); }
async function persist(){
  var ok = await sset('log:entries', JSON.stringify(S.entries));
  if(!ok) toast('Opslaan lukte niet, probeer opnieuw');
  return ok;
}
async function getPhotos(id){
  if(S.cache[id]) return S.cache[id];
  var r = await sget('photos:'+id); var p={};
  if(r && r.value){ try{ p=JSON.parse(r.value)||{}; }catch(e){} }
  S.cache[id]=p; return p;
}

/* ============ afgeleide waarden ============ */
function last(){ return S.entries.length ? S.entries[S.entries.length-1] : null; }
function prevWith(idx,getter){ for(var i=idx-1;i>=0;i--){ var v=getter(S.entries[i]); if(v!==null&&v!==undefined&&v!=='') return v; } return null; }
function series(key){
  var g=METRICS[key].get, out=[];
  S.entries.forEach(function(e){ var v=g(e); if(v!==null&&v!==undefined&&v!=='') out.push({date:e.date,v:+v,e:e}); });
  return out;
}

/* ============ render: hero ============ */
async function renderHero(){
  var slot=$('heroSlot'), e=last();
  if(!e){
    slot.innerHTML='<div class="hero empty"><div class="inner"><h2>Begin bij week één</h2><p>Weeg je, maak drie foto\'s en leg het hier vast. Over acht weken zie je wat er echt veranderd is.</p></div></div>';
    return;
  }
  var i=S.entries.length-1;
  var pw=prevWith(i,function(x){return x.weight;});
  var d=(e.weight!==null&&pw!==null)?(e.weight-pw):null;
  var cls='', txt='Eerste meting vastgelegd';
  if(d!==null){
    var dir = S.goal!==null ? ((S.goal < (S.entries[0].weight||e.weight)) ? -1 : 1) : 0;
    cls = d===0 ? '' : (dir!==0 ? ((d<0)===(dir<0)?'good':'up') : (d<0?'good':'up'));
    txt = signed(d)+' kg sinds de vorige meting';
  }
  var goalHtml='';
  if(S.goal!==null && e.weight!==null){
    var start=null; for(var k=0;k<S.entries.length;k++){ if(S.entries[k].weight!==null){ start=S.entries[k].weight; break; } }
    if(start===null) start=e.weight;
    var span=S.goal-start, done=e.weight-start;
    var pct = span===0?100:Math.max(0,Math.min(100,(done/span)*100));
    var left=Math.abs(e.weight-S.goal);
    goalHtml='<div class="goalbar"><div class="track"><div class="fill" style="width:'+pct.toFixed(1)+'%"></div></div>'+
      '<p>'+(left<0.05?'Je bent op je doel van ':'Nog '+fmt(left)+' kg tot je doel van ')+fmt(S.goal)+' kg</p></div>';
  }
  slot.innerHTML='<div class="hero"><div class="scrim"></div><div class="inner">'+
    '<p class="when">'+esc(dNL(e.date,true))+', week '+isoWeek(e.date)+'</p>'+
    '<p class="bignum"><b>'+(e.weight!==null?fmt(e.weight):'–')+'</b><span>kg</span></p>'+
    '<span class="delta '+cls+'">'+esc(txt)+'</span>'+goalHtml+'</div></div>';

  var ph=await getPhotos(e.id);
  var src=ph.front||ph.side||ph.back||(e.thumbs&&(e.thumbs.front||e.thumbs.side||e.thumbs.back));
  if(src){
    var hero=slot.querySelector('.hero');
    var im=document.createElement('img'); im.className='shot'; im.alt=''; im.src=src;
    hero.insertBefore(im,hero.firstChild);
  }
}

/* ============ render: statstrip ============ */
function renderStrip(){
  var el=$('strip'), e=last();
  if(!e){ el.innerHTML=''; return; }
  var i=S.entries.length-1, keys=['fat','muscle','waist','visc'], html='';
  keys.forEach(function(k){
    var m=METRICS[k], v=m.get(e);
    if(v===null||v===undefined||v==='') return;
    var p=prevWith(i,m.get), c='', ct='';
    if(p!==null){ var d=v-p; ct=signed(d,k==='visc'?0:1)+(m.unit?' '+m.unit:''); c=d<0?'dn':(d>0?'upx':''); }
    html+='<div class="stat"><h4>'+m.label+'</h4><div class="v">'+fmt(v,k==='visc'?0:1)+'<small>'+m.unit+'</small></div>'+
      (ct?'<div class="c '+c+'">'+ct+'</div>':'<div class="c">eerste keer</div>')+'</div>';
  });
  if(!html && e){ html='<div class="stat" style="grid-column:1/-1"><h4>Bodyscan</h4><div class="c" style="margin-top:0">Heb je een scan laten doen? Zet de schakelaar aan bij een nieuwe meting en vul de cijfers in.</div></div>'; }
  el.innerHTML=html;
}

/* ============ render: grafiek ============ */
function renderChart(){
  var avail=Object.keys(METRICS).filter(function(k){ return series(k).length>0; });
  if(!avail.length || S.entries.length<1){ $('chartCard').hidden=true; return; }
  $('chartCard').hidden=false;
  if(avail.indexOf(S.metric)<0) S.metric=avail[0];
  $('metricChips').innerHTML=avail.map(function(k){
    return '<button class="chip" data-metric="'+k+'" aria-pressed="'+(k===S.metric)+'">'+METRICS[k].label+'</button>';
  }).join('');
  drawChart();
}
function drawChart(){
  var m=METRICS[S.metric], data=series(S.metric), box=$('chartBox'), svg=$('chart');
  var W=box.clientWidth||320, H=box.clientHeight||210, PL=8, PR=44, PT=18, PB=26;
  $('rangeLbl').textContent = data.length>1 ? dNL(data[0].date)+' tot '+dNL(data[data.length-1].date) : '';
  if(data.length<2){
    svg.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="#918DB4" font-size="13" font-family="Inter,sans-serif">Nog één meetpunt. Vanaf de tweede zie je een lijn.</text>';
    return;
  }
  var vals=data.map(function(d){return d.v;}), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(S.goal!==null && S.metric==='weight'){ mn=Math.min(mn,S.goal); mx=Math.max(mx,S.goal); }
  var pad=(mx-mn)*0.22||1; mn-=pad; mx+=pad;
  var t0=new Date(data[0].date).getTime(), t1=new Date(data[data.length-1].date).getTime();
  var X=function(d){ return PL+((new Date(d.date).getTime()-t0)/((t1-t0)||1))*(W-PL-PR); };
  var Y=function(v){ return PT+(1-(v-mn)/((mx-mn)||1))*(H-PT-PB); };
  var pts=data.map(function(d){ return {x:X(d),y:Y(d.v),d:d}; });
  var line=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' ');
  var area=line+' L'+pts[pts.length-1].x.toFixed(1)+' '+(H-PB)+' L'+pts[0].x.toFixed(1)+' '+(H-PB)+' Z';
  var g='', steps=3;
  for(var i=0;i<=steps;i++){
    var v=mn+(mx-mn)*(i/steps), y=Y(v);
    g+='<line x1="'+PL+'" x2="'+(W-PR+6)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#241F36" stroke-width="1"/>'+
       '<text x="'+(W-PR+11)+'" y="'+(y+4).toFixed(1)+'" fill="#6E698C" font-size="11" font-family="Inter,sans-serif">'+fmt(v,(mx-mn)>20?0:1)+'</text>';
  }
  var goalLine='';
  if(S.goal!==null && S.metric==='weight'){
    var gy=Y(S.goal);
    goalLine='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="#FFC53D" stroke-width="2" stroke-dasharray="5 5"/>';
  }
  svg.innerHTML='<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+m.color+'" stop-opacity=".30"/><stop offset="1" stop-color="'+m.color+'" stop-opacity="0"/></linearGradient></defs>'+
    g+goalLine+'<path d="'+area+'" fill="url(#ar)"/>'+
    '<path d="'+line+'" fill="none" stroke="'+m.color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts.map(function(p,i){
      var lastOne = i===pts.length-1;
      return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(lastOne?5.5:3.4)+'" fill="'+(lastOne?m.color:'#12101E')+'" stroke="'+m.color+'" stroke-width="2.2"/>';
    }).join('')+
    '<text x="'+PL+'" y="'+(H-6)+'" fill="#6E698C" font-size="11" font-family="Inter,sans-serif">'+dNL(data[0].date)+'</text>'+
    '<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" fill="#6E698C" font-size="11" font-family="Inter,sans-serif">'+dNL(data[data.length-1].date)+'</text>';
  box._pts=pts;
}
function chartHover(ev){
  var box=$('chartBox'), pts=box._pts, tip=$('tip');
  if(!pts||!pts.length) return;
  var r=box.getBoundingClientRect(), x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  var best=pts[0],bd=1e9;
  pts.forEach(function(p){ var d=Math.abs(p.x-x); if(d<bd){bd=d;best=p;} });
  var m=METRICS[S.metric];
  tip.innerHTML='<b>'+fmt(best.d.v,S.metric==='visc'?0:1)+'</b> '+m.unit+' — '+dNL(best.d.date);
  tip.style.left=best.x+'px'; tip.style.top=best.y+'px'; tip.classList.add('on');
}

/* ============ render: lijst ============ */
function renderList(){
  var el=$('list');
  if(!S.entries.length){
    el.innerHTML='<p class="hint">Nog geen metingen. Je eerste komt hier te staan.</p>';
    $('countLbl').textContent=''; $('foot').textContent='';
    return;
  }
  var rev=S.entries.slice().reverse();
  $('countLbl').textContent=S.entries.length+(S.entries.length===1?' meting':' metingen');
  $('foot').textContent='Alles staat lokaal in deze app opgeslagen, alleen voor jou zichtbaar.';
  el.innerHTML=rev.map(function(e,ri){
    var idx=S.entries.length-1-ri;
    var pw=prevWith(idx,function(x){return x.weight;});
    var d=(e.weight!==null&&pw!==null)?(e.weight-pw):null;
    var tag = d===null?'':'<span class="tag '+(d<0?'dn':(d>0?'upx':''))+'">'+signed(d)+' kg</span>';
    var th='';
    POSES.forEach(function(p){
      var t=e.thumbs&&e.thumbs[p[0]];
      if(t) th+='<button data-open="'+e.id+'" data-pose="'+p[0]+'" aria-label="'+p[1]+' vergroten"><img src="'+t+'" alt="'+p[1]+' op '+dNL(e.date)+'"></button>';
    });
    var ms='';
    [['fat','Vet','%',1],['muscle','Spier','kg',1],['visc','Visceraal','',0],['water','Vocht','%',1],['bone','Bot','kg',1],['bmr','Rust','kcal',0]].forEach(function(f){
      var v=e.scan&&e.scan[f[0]]; if(v===null||v===undefined||v==='') return;
      ms+='<span class="m">'+f[1]+' <b>'+fmt(v,f[3])+'</b>'+(f[2]?' '+f[2]:'')+'</span>';
    });
    [['waist','Taille'],['chest','Borst'],['hip','Heup'],['arm','Arm'],['thigh','Been']].forEach(function(f){
      var v=e.meas&&e.meas[f[0]]; if(v===null||v===undefined||v==='') return;
      ms+='<span class="m">'+f[1]+' <b>'+fmt(v)+'</b> cm</span>';
    });
    return '<article class="entry'+(ri===0?' recent':'')+'">'+
      '<div class="row1"><span class="week">Week '+isoWeek(e.date)+'</span><span class="date">'+dNL(e.date,true)+'</span>'+tag+'</div>'+
      '<p class="w">'+(e.weight!==null?fmt(e.weight):'–')+'<small>kg</small></p>'+
      (th?'<div class="thumbs">'+th+'</div>':'')+
      (ms?'<div class="mgrid">'+ms+'</div>':'')+
      (e.note?'<p class="note">'+esc(e.note)+'</p>':'')+
      '<div class="acts"><button data-edit="'+e.id+'">Bewerken</button><button class="danger" data-del="'+e.id+'">Verwijderen</button></div>'+
      '</article>';
  }).join('');
}

/* ============ render: vergelijken ============ */
function renderCompare(){
  var withPhoto=S.entries.filter(function(e){ return e.thumbs&&(e.thumbs.front||e.thumbs.side||e.thumbs.back); });
  if(withPhoto.length<2){ $('cmpCard').hidden=true; return; }
  $('cmpCard').hidden=false;
  var opts=withPhoto.map(function(e){ return '<option value="'+e.id+'">Week '+isoWeek(e.date)+' — '+dNL(e.date)+(e.weight!==null?' — '+fmt(e.weight)+' kg':'')+'</option>'; }).join('');
  var a=$('cmpA'), b=$('cmpB'), pa=a.value, pb=b.value;
  a.innerHTML=opts; b.innerHTML=opts;
  a.value = pa && withPhoto.some(function(e){return e.id===pa;}) ? pa : withPhoto[0].id;
  b.value = pb && withPhoto.some(function(e){return e.id===pb;}) ? pb : withPhoto[withPhoto.length-1].id;
  $('poseChips').innerHTML=POSES.map(function(p){ return '<button class="chip" data-pose-sel="'+p[0]+'" aria-pressed="'+(p[0]===S.pose)+'">'+p[1]+'</button>'; }).join('');
  loadCompare();
}
async function loadCompare(){
  var ea=S.entries.filter(function(e){return e.id===$('cmpA').value;})[0];
  var eb=S.entries.filter(function(e){return e.id===$('cmpB').value;})[0];
  if(!ea||!eb) return;
  var pa=await getPhotos(ea.id), pb=await getPhotos(eb.id);
  var sa=pa[S.pose]||(ea.thumbs&&ea.thumbs[S.pose]), sb=pb[S.pose]||(eb.thumbs&&eb.thumbs[S.pose]);
  $('imgA').src=sa||''; $('imgB').src=sb||'';
  $('labA').textContent=dNL(ea.date)+(ea.weight!==null?' — '+fmt(ea.weight)+' kg':'');
  $('labB').textContent=dNL(eb.date)+(eb.weight!==null?' — '+fmt(eb.weight)+' kg':'');
  var msg='';
  if(!sa||!sb){ msg='Van deze combinatie is er geen '+POSES.filter(function(p){return p[0]===S.pose;})[0][1].toLowerCase()+'-foto. Kies een andere hoek of meting.'; }
  else if(ea.weight!==null&&eb.weight!==null){
    var d=eb.weight-ea.weight, dgs=[];
    dgs.push(signed(d)+' kg');
    if(ea.scan&&eb.scan&&ea.scan.fat!=null&&eb.scan.fat!=null) dgs.push(signed(eb.scan.fat-ea.scan.fat)+' procentpunt vet');
    msg='Tussen deze twee: '+dgs.join(' en ')+'. Sleep de knop om te schuiven.';
  } else msg='Sleep de knop om tussen de twee foto\'s te schuiven.';
  $('cmpHint').textContent=msg;
}
function setSplit(pct){
  pct=Math.max(0,Math.min(100,pct));
  $('imgB').style.clipPath='inset(0 0 0 '+pct+'%)';
  $('handle').style.left=pct+'%';
}

function renderAll(){ renderHero(); renderStrip(); renderChart(); renderList(); renderCompare(); }

/* ============ formulier ============ */
function tiles(){
  $('photoTiles').innerHTML=POSES.map(function(p){
    var d=S.draft[p[0]];
    return '<label class="ptile" data-tile="'+p[0]+'">'+
      (d?'<img src="'+d+'" alt=""><span class="cap">'+p[1]+'</span><button type="button" class="kill" data-kill="'+p[0]+'" aria-label="'+p[1]+' verwijderen">✕</button>'
        :'<span class="ph"><em>+</em>'+p[1]+'</span>')+
      '<input type="file" accept="image/*" data-pose-in="'+p[0]+'" aria-label="Foto '+p[1]+'"></label>';
  }).join('');
}
function openSheet(id){
  S.editId=id||null; S.draft={}; $('formErr').hidden=true;
  ['fWeight','fNote','fFat','fMuscle','fVisc','fWater','fBone','fBmr','mWaist','mChest','mHip','mArm','mThigh'].forEach(function(k){ $(k).value=''; });
  $('scanSw').setAttribute('aria-pressed','false'); $('scanFold').classList.remove('on');
  if(id){
    var e=S.entries.filter(function(x){return x.id===id;})[0];
    if(e){
      $('sheetTitle').textContent='Meting bewerken';
      $('fDate').value=e.date; $('fWeight').value=e.weight!==null?fmt(e.weight):''; $('fNote').value=e.note||'';
      var s=e.scan||{}, m=e.meas||{};
      var map={fFat:s.fat,fMuscle:s.muscle,fVisc:s.visc,fWater:s.water,fBone:s.bone,fBmr:s.bmr,mWaist:m.waist,mChest:m.chest,mHip:m.hip,mArm:m.arm,mThigh:m.thigh};
      var any=false;
      Object.keys(map).forEach(function(k){ if(map[k]!==null&&map[k]!==undefined&&map[k]!==''){ $(k).value=String(map[k]).replace('.',','); any=true; } });
      if(any){ $('scanSw').setAttribute('aria-pressed','true'); $('scanFold').classList.add('on'); }
      getPhotos(id).then(function(p){ POSES.forEach(function(q){ if(p[q[0]]) S.draft[q[0]]=p[q[0]]; }); tiles(); });
    }
  } else {
    $('sheetTitle').textContent='Nieuwe meting'; $('fDate').value=today();
  }
  tiles();
  $('veil').classList.add('on'); $('sheet').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('veil').classList.remove('on'); $('sheet').classList.remove('on');
  document.body.style.overflow=''; $('sheet').scrollTop=0;
}
async function save(){
  var date=$('fDate').value||today();
  var w=num($('fWeight').value);
  var scan={fat:num($('fFat').value),muscle:num($('fMuscle').value),visc:num($('fVisc').value),water:num($('fWater').value),bone:num($('fBone').value),bmr:num($('fBmr').value)};
  var meas={waist:num($('mWaist').value),chest:num($('mChest').value),hip:num($('mHip').value),arm:num($('mArm').value),thigh:num($('mThigh').value)};
  var hasAny = w!==null || Object.keys(scan).some(function(k){return scan[k]!==null;}) || Object.keys(meas).some(function(k){return meas[k]!==null;}) || S.draft.front||S.draft.side||S.draft.back;
  if(!hasAny){ var er=$('formErr'); er.textContent='Vul minstens je gewicht in, of voeg een foto toe.'; er.hidden=false; return; }
  var btn=$('saveBtn'); btn.disabled=true; btn.textContent='Bezig met opslaan…';

  var id=S.editId||('e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  var thumbs={}, full={};
  for(var i=0;i<POSES.length;i++){
    var p=POSES[i][0], src=S.draft[p];
    if(!src) continue;
    full[p]=src;
    try{ thumbs[p]=await down(src,230,0.55); }catch(e){ thumbs[p]=src; }
  }
  var rec={id:id,date:date,weight:w,note:$('fNote').value.trim(),scan:scan,meas:meas,thumbs:thumbs};
  var ix=-1; S.entries.forEach(function(e,k){ if(e.id===id) ix=k; });
  if(ix>=0) S.entries[ix]=rec; else S.entries.push(rec);
  sort();
  if(Object.keys(full).length){ S.cache[id]=full; await sset('photos:'+id, JSON.stringify(full)); }
  else { S.cache[id]={}; await sdel('photos:'+id); }
  await persist();
  btn.disabled=false; btn.textContent='Meting opslaan';
  closeSheet(); renderAll(); toast(ix>=0?'Meting bijgewerkt':'Meting opgeslagen');
}
function down(dataUrl,max,q){
  return loadImg(dataUrl).then(function(im){
    return canvasOut(im, im.naturalWidth||im.width, im.naturalHeight||im.height, max, q) || dataUrl;
  }).catch(function(){ return dataUrl; });
}

/* ============ events ============ */
$('addBtn').addEventListener('click',function(){ openSheet(null); });
$('closeBtn').addEventListener('click',closeSheet);
$('veil').addEventListener('click',closeSheet);
$('saveBtn').addEventListener('click',save);
$('scanSw').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')==='true';
  this.setAttribute('aria-pressed',String(!on));
  $('scanFold').classList.toggle('on',!on);
});
$('photoTiles').addEventListener('change',function(ev){
  var inp=ev.target.closest('[data-pose-in]'); if(!inp||!inp.files||!inp.files[0]) return;
  var pose=inp.getAttribute('data-pose-in'), file=inp.files[0];
  var tile=inp.closest('.ptile');
  if(tile){ var ph=tile.querySelector('.ph'); if(ph) ph.innerHTML='<em>◴</em>bezig…'; }
  shrink(file,1100,0.78).then(function(d){
    S.draft[pose]=d; tiles();
    if(d.length>2000000) toast('Grote foto opgeslagen, verkleinen lukte niet');
  }).catch(function(){
    tiles();
    var n=(file.name||'').toLowerCase();
    if(/\.(heic|heif)$/.test(n)) toast('HEIC-foto\'s werken hier niet, kies JPG of PNG');
    else toast('Dit bestand is geen leesbare afbeelding');
  });
  inp.value='';
});
$('photoTiles').addEventListener('click',function(ev){
  var k=ev.target.closest('[data-kill]'); if(!k) return;
  ev.preventDefault(); ev.stopPropagation();
  delete S.draft[k.getAttribute('data-kill')]; tiles();
});
$('metricChips').addEventListener('click',function(ev){
  var c=ev.target.closest('[data-metric]'); if(!c) return;
  S.metric=c.getAttribute('data-metric'); renderChart();
});
$('poseChips').addEventListener('click',function(ev){
  var c=ev.target.closest('[data-pose-sel]'); if(!c) return;
  S.pose=c.getAttribute('data-pose-sel');
  Array.prototype.forEach.call(this.children,function(b){ b.setAttribute('aria-pressed',String(b===c)); });
  loadCompare();
});
$('cmpA').addEventListener('change',loadCompare);
$('cmpB').addEventListener('change',loadCompare);

$('list').addEventListener('click',async function(ev){
  var o=ev.target.closest('[data-open]');
  if(o){
    var e=S.entries.filter(function(x){return x.id===o.getAttribute('data-open');})[0];
    var pose=o.getAttribute('data-pose');
    var p=await getPhotos(e.id);
    $('boxImg').src=p[pose]||e.thumbs[pose];
    $('boxCap').textContent=POSES.filter(function(q){return q[0]===pose;})[0][1]+' — '+dNL(e.date,true)+(e.weight!==null?' — '+fmt(e.weight)+' kg':'');
    $('box').classList.add('on'); return;
  }
  var ed=ev.target.closest('[data-edit]');
  if(ed){ openSheet(ed.getAttribute('data-edit')); return; }
  var dl=ev.target.closest('[data-del]');
  if(dl){
    if(dl.classList.contains('armed')){
      var id=dl.getAttribute('data-del');
      S.entries=S.entries.filter(function(x){return x.id!==id;});
      delete S.cache[id]; await sdel('photos:'+id); await persist();
      renderAll(); toast('Meting verwijderd');
    } else {
      dl.classList.add('armed'); dl.textContent='Zeker weten?';
      setTimeout(function(){ if(dl.isConnected){ dl.classList.remove('armed'); dl.textContent='Verwijderen'; } },3500);
    }
  }
});
$('boxX').addEventListener('click',function(){ $('box').classList.remove('on'); });
$('box').addEventListener('click',function(ev){ if(ev.target===this) this.classList.remove('on'); });

/* slider */
(function(){
  var c=$('cmp'), drag=false;
  function move(ev){
    if(!drag) return;
    var r=c.getBoundingClientRect(), x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    setSplit((x/r.width)*100);
  }
  c.addEventListener('pointerdown',function(ev){ drag=true; c.setPointerCapture(ev.pointerId); move(ev); });
  c.addEventListener('pointermove',move);
  c.addEventListener('pointerup',function(){ drag=false; });
  c.addEventListener('pointercancel',function(){ drag=false; });
})();

/* grafiek aanwijzen */
(function(){
  var b=$('chartBox');
  b.addEventListener('pointermove',chartHover);
  b.addEventListener('pointerdown',chartHover);
  b.addEventListener('pointerleave',function(){ $('tip').classList.remove('on'); });
})();
window.addEventListener('resize',function(){ if(!$('chartCard').hidden) drawChart(); });

/* doel */
$('goalBtn').addEventListener('click',async function(){
  var cur=S.goal!==null?fmt(S.goal):'';
  var v=window.prompt('Welk gewicht wil je bereiken? Laat leeg om het doel weg te halen.',cur);
  if(v===null) return;
  var n=num(v);
  S.goal = (v.trim()==='')?null:n;
  await sset('log:settings', JSON.stringify({goal:S.goal}));
  renderHero(); renderChart(); toast(S.goal===null?'Doel weggehaald':'Doel op '+fmt(S.goal)+' kg gezet');
});

/* export */
$('expBtn').addEventListener('click',async function(){
  if(!S.entries.length){ toast('Er is nog niets om op te slaan'); return; }
  var btn=this; btn.disabled=true; btn.textContent='Bezig…';
  var photos={};
  for(var i=0;i<S.entries.length;i++){
    try{ photos[S.entries[i].id] = await getPhotos(S.entries[i].id); }catch(e){}
  }
  var data={app:'voortgang',version:1,exported:new Date().toISOString(),goal:S.goal,entries:S.entries,photos:photos};
  var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='voortgang-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  btn.disabled=false; btn.textContent='Back-up';
  toast('Back-up met al je foto\'s gedownload');
});

/* import */
$('impInput').addEventListener('change',function(ev){
  var f=ev.target.files && ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=async function(){
    var d;
    try{ d=JSON.parse(r.result); }catch(e){ toast('Dit bestand kan ik niet lezen'); return; }
    if(!d || !Array.isArray(d.entries)){ toast('Geen back-up van deze app'); return; }
    var known={}; S.entries.forEach(function(e){ known[e.id]=true; });
    var added=0;
    for(var i=0;i<d.entries.length;i++){
      var e=d.entries[i]; if(!e || !e.id) continue;
      if(known[e.id]){ S.entries=S.entries.filter(function(x){return x.id!==e.id;}); } else added++;
      S.entries.push(e);
      var p = d.photos && d.photos[e.id];
      if(p && Object.keys(p).length){ S.cache[e.id]=p; await sset('photos:'+e.id, JSON.stringify(p)); }
    }
    if(d.goal!==undefined && d.goal!==null && S.goal===null){ S.goal=d.goal; await sset('log:settings', JSON.stringify({goal:S.goal})); }
    sort(); await persist(); renderAll();
    toast(added+' metingen teruggezet');
  };
  r.readAsText(f);
  ev.target.value='';
});
$('impBtn').addEventListener('click',function(){ $('impInput').click(); });

document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape') return;
  if($('box').classList.contains('on')) $('box').classList.remove('on');
  else if($('sheet').classList.contains('on')) closeSheet();
});

setSplit(50);
initStore().then(function(){
  if(backend==='mem'){
    var b=document.createElement('div');
    b.className='warn';
    b.innerHTML='<b>Deze weergave bewaart niets.</b> Download het bestand met de knop hieronder en open het daarna vanuit je browser, dan blijft alles staan.';
    document.querySelector('.wrap').insertBefore(b, $('heroSlot'));
  }
  load();
});
})();
</script>
